# -----------------------------------------------------------------------
# Application
# -----------------------------------------------------------------------
spring.application.name=demo

# -----------------------------------------------------------------------
# Project Loom – virtual threads for Tomcat and Spring MVC
# Requires Spring Boot 3.2+ and Java 21+
# -----------------------------------------------------------------------
spring.threads.virtual.enabled=true

# -----------------------------------------------------------------------
# H2 in-memory database (development / testing)
# -----------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:demodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable the H2 console at /h2-console (useful during development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------
server.port=8080
